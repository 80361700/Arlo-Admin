host: localhost:8090
info:
  contact:
    name: arlo-admin
  description: 管理后台 API 接口文档
  title: arlo-admin API
  version: 1.0.0
paths:
  /auth/captcha:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/arlo-admin_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/arlo-admin_internal_modules_auth_dto.CaptchaResponse'
              type: object
      summary: 获取图形验证码
      tags:
      - Auth
  /auth/info:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/arlo-admin_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/arlo-admin_internal_modules_auth_dto.UserInfoResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/arlo-admin_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/arlo-admin_internal_modules_auth_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/arlo-admin_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/arlo-admin_internal_modules_auth_dto.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/arlo-admin_pkg_response.Response'
      summary: 用户登录
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: 可选 refreshToken
        in: body
        name: request
        schema:
          $ref: '#/definitions/arlo-admin_internal_modules_auth_dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arlo-admin_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/arlo-admin_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - Auth
  /auth/menus:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/arlo-admin_pkg_response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/arlo-admin_internal_modules_auth_dto.MenuTreeNode'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/arlo-admin_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: 获取当前用户菜单
      tags:
      - Auth
  /auth/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: 修改密码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/arlo-admin_internal_modules_auth_dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arlo-admin_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - Auth
  /auth/profile:
    put:
      consumes:
      - application/json
      parameters:
      - description: 个人资料
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/arlo-admin_internal_modules_auth_dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arlo-admin_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: 更新个人资料
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: 刷新令牌请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/arlo-admin_internal_modules_auth_dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/arlo-admin_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/arlo-admin_internal_modules_auth_dto.RefreshResponse'
              type: object
        "401":
          description: Unauthorized
