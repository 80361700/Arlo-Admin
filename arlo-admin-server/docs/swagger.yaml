basePath: /api/v1
definitions:
  arlo-admin_internal_modules_auth_dto.CaptchaResponse:
    properties:
      captcha:
        description: 验证码图片（base64）
        example: data:image/png;base64,iVBORw0KGgo...
        type: string
      captchaId:
        description: 验证码ID
        example: abc123
        type: string
    type: object
  arlo-admin_internal_modules_auth_dto.ChangePasswordRequest:
    properties:
      newPassword:
        example: newpwd
        maxLength: 32
        minLength: 6
        type: string
      oldPassword:
        example: oldpwd
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  arlo-admin_internal_modules_auth_dto.LoginRequest:
    properties:
      captchaCode:
        description: 验证码
        example: "1234"
        type: string
      captchaId:
        description: 验证码ID
        example: abc123
        type: string
      password:
        description: 密码
        example: "123456"
        type: string
      username:
        description: 用户名
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  arlo-admin_internal_modules_auth_dto.LoginResponse:
    properties:
      accessToken:
        description: 访问令牌
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expiresIn:
        description: 过期时间（秒）
        example: 7200
        type: integer
      refreshToken:
        description: 刷新令牌
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
    type: object
  arlo-admin_internal_modules_auth_dto.LogoutRequest:
    properties:
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
    type: object
  arlo-admin_internal_modules_auth_dto.MenuTreeNode:
    properties:
      children:
        items:
          $ref: '#/definitions/arlo-admin_internal_modules_auth_dto.MenuTreeNode'
        type: array
      component:
        type: string
      icon:
        type: string
      id:
        type: integer
      keepAlive:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      path:
        type: string
      permission:
        type: string
      sort:
        type: integer
      type:
        description: 1=目录 2=菜单 3=按钮
        type: integer
      visible:
        type: integer
    type: object
  arlo-admin_internal_modules_auth_dto.RefreshRequest:
    properties:
      refreshToken:
        description: 刷新令牌
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
    required:
    - refreshToken
    type: object
  arlo-admin_internal_modules_auth_dto.RefreshResponse:
    properties:
      accessToken:
        description: 访问令牌
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expiresIn:
        description: 过期时间（秒）
        example: 7200
        type: integer
    type: object
  arlo-admin_internal_modules_auth_dto.UpdateProfileRequest:
    properties:
      avatar:
        example: ""
        type: string
      email:
        example: zhangsan@example.com
        type: string
      gender:
        example: 1
        type: integer
      nickname:
        example: 张三
        maxLength: 32
        type: string
      phone:
        example: "13800138000"
        type: string
      remark:
        example: ""
        type: string
    required:
    - nickname
    type: object
  arlo-admin_internal_modules_auth_dto.UserInfoResponse:
    properties:
      avatar:
        description: 头像URL
        example: ""
        type: string
      dataScope:
        description: '数据范围: 1=全部 2=自定义 3=本部门及以下 4=本部门 5=仅本人'
        example: 1
        type: integer
      deptId:
        description: 部门ID
        example: 1
        type: integer
      deptIds:
        description: 自定义数据时可见的部门ID
        items:
          type: integer
        type: array
      deptName:
        description: 部门名称
        example: 技术部
        type: string
      email:
        description: 邮箱
        example: admin@example.com
        type: string
      gender:
        description: 性别（0=未知 1=男 2=女）
        example: 1
        type: integer
      id:
        description: 用户ID
        example: 1
        type: integer
      mustChangePwd:
        description: 是否强制改密
        type: boolean
      nickname:
        description: 昵称
        example: 系统管理员
        type: string
      permissions:
        description: 权限标识列表
        items:
          type: string
        type: array
      phone:
        description: 手机号
        example: "13800138000"
        type: string
      postNames:
        description: 岗位名称列表
        items:
          type: string
        type: array
      pwdExpired:
        description: 密码是否已过期
        type: boolean
      remark:
        description: 备注
        type: string
      roleNames:
        description: 角色名称列表
        items:
          type: string
        type: array
      status:
        description: 状态（0=禁用 1=启用）
        example: 1
        type: integer
      username:
        description: 用户名
        example: admin
        type: string
    type: object
  arlo-admin_internal_modules_file_dto.FileListResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/arlo-admin_internal_modules_file_dto.FileResponse'
        type: array
      page:
        example: 1
        type: integer
      pageSize:
        example: 10
        type: integer
      total:
        example: 100
        type: integer
    type: object
  arlo-admin_internal_modules_file_dto.FileResponse:
    properties:
      category:
        description: '文件分类: image/video/audio/document/other'
        example: image
        type: string
      createdAt:
        description: 上传时间
        type: string
      id:
        description: 文件ID
        example: 1
        type: integer
      md5:
        description: MD5校验值
        example: d41d8cd98f00b204e9800998ecf8427e
        type: string
      mimeType:
        description: MIME类型
        example: image/png
        type: string
      name:
        description: 原始文件名
        example: avatar.png
        type: string
      size:
        description: 文件大小(字节)
        example: 102400
        type: integer
      uploader:
        description: 上传者
        example: admin
        type: string
      uploaderId:
        description: 上传者ID
        example: 1
        type: integer
      url:
        description: 访问URL
        example: http://localhost:8080/api/v1/file/1/download
        type: string
    type: object


  arlo-admin_internal_modules_log_dto.LoginLogListResponse:
    properties:
      list:
        description: 登录日志列表
        items:
          $ref: '#/definitions/arlo-admin_internal_modules_log_dto.LoginLogResponse'
        type: array
      page:
        description: 当前页码
        example: 1
        type: integer
      pageSize:
        description: 每页条数
        example: 10
        type: integer
      total:
        description: 总记录数
        example: 100
        type: integer
    type: object
  arlo-admin_internal_modules_log_dto.LoginLogResponse:
    properties:
      browser:
        description: 浏览器
        example: Chrome 120
        type: string
      createdAt:
        description: 登录时间
        example: "2026-07-10 12:00:00"
        type: string
      id:
        description: 日志ID
        example: 1
        type: integer
      ip:
        description: 登录IP
        example: 127.0.0.1
        type: string
      location:
        description: 登录地点
        example: 本地
        type: string
      msg:
        description: 提示消息
        example: 登录成功
        type: string
      os:
        description: 操作系统
        example: macOS
        type: string
      status:
        description: 状态（0=失败 1=成功）
        example: 1
        type: integer
      username:
        description: 用户名
        example: admin
        type: string
    type: object
  arlo-admin_internal_modules_log_dto.OperationLogListResponse:
    properties:
      list:
        description: 操作日志列表
        items:
          $ref: '#/definitions/arlo-admin_internal_modules_log_dto.OperationLogResponse'
        type: array
      page:
        description: 当前页码
        example: 1
        type: integer
      pageSize:
        description: 每页条数
        example: 10
        type: integer
      total:
        description: 总记录数
        example: 500
        type: integer
    type: object
  arlo-admin_internal_modules_log_dto.OperationLogResponse:
    properties:
      action:
        description: 操作类型
        example: 查询
        type: string
      costTime:
        description: 耗时（毫秒）
        example: 12
        type: integer
      createdAt:
        description: 操作时间
        example: "2026-07-10 12:00:00"
        type: string
      errorMsg:
        description: 错误信息
        example: ""
        type: string
      id:
        description: 日志ID
        example: 1
        type: integer
      ip:
        description: 操作IP
        example: 127.0.0.1
        type: string
      method:
        description: 请求方法
        example: GET
        type: string
      module:
        description: 操作模块
        example: 用户管理
        type: string
      params:
        description: 请求参数
        example: '{"page":1,"pageSize":10}'
        type: string
      result:
        description: 响应摘要
        type: string
      status:
        description: 状态（0=失败 1=成功）
        example: 1
        type: integer
      url:
        description: 请求URL
        example: /api/v1/system/user/list
        type: string
      userAgent:
        description: 用户代理
        example: Mozilla/5.0...
        type: string
      userId:
        description: 用户ID
        example: 1
        type: integer
      username:
        description: 用户名
        example: admin
        type: string
    type: object
  arlo-admin_internal_modules_sysconfig_dto.ConfigResponse:
    properties:
      createdAt:
        description: 创建时间
        type: string
      id:
        description: 配置ID
        example: 1
        type: integer
      key:
        description: 配置键
        example: sys.name
        type: string
      name:
        description: 配置名称
        example: 系统名称
        type: string
      remark:
        description: 备注
        example: 系统显示名称
        type: string
      type:
        description: '类型: 1=文本,2=JSON,3=开关,4=图片'
        example: 1
        type: integer
      updatedAt:
        description: 更新时间
        type: string
      value:
        description: 配置值
        example: Arlo Admin
        type: string
    type: object
  arlo-admin_internal_modules_sysconfig_dto.CreateConfigRequest:
    properties:
      key:
        description: 配置键（唯一）
        example: sys.name
        type: string
      name:
        description: 配置名称
        example: 系统名称
        type: string
      remark:
        description: 备注
        example: 系统显示名称
        type: string
      type:
        description: '类型: 1=文本,2=JSON,3=开关,4=图片'
        enum:
        - 1
        - 2
        - 3
        - 4
        example: 1
        type: integer
      value:
        description: 配置值（图片可空；开关默认 false）
        example: Arlo Admin
        type: string
    required:
    - key
    - name
    - type
    type: object
  arlo-admin_internal_modules_sysconfig_dto.PublicConfigResponse:
    properties:
      captcha:
        description: 是否开启验证码 sys.captcha
        example: false
        type: boolean
      logo:
        description: 系统 Logo sys.logo
        example: ""
        type: string
      name:
        description: 系统名称 sys.name
        example: Arlo Admin
        type: string
      version:
        description: 系统版本 sys.version
        example: 1.0.0
        type: string
    type: object
  arlo-admin_internal_modules_sysconfig_dto.UpdateConfigRequest:
    properties:
      id:
        description: 配置ID
        example: 1
        type: integer
      key:
        description: 配置键（唯一）
        example: sys.name
        type: string
      name:
        description: 配置名称
        example: 系统名称
        type: string
      remark:
        description: 备注
        example: 系统显示名称
        type: string
      type:
        description: '类型: 1=文本,2=JSON,3=开关,4=图片'
        enum:
        - 1
        - 2
        - 3
        - 4
        example: 1
        type: integer
      value:
        description: 配置值
        example: Arlo Admin
        type: string
    required:
    - id
    - key
    - name
    - type
    type: object
  arlo-admin_internal_modules_system_dto.CreateUserRequest:
    properties:
      avatar:
        description: 头像URL
        example: https://example.com/avatar.png
